<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVFetch</title>
<style>
:root{color-scheme:dark;--bg:#000;--surface:#101010;--surface-raised:#181818;--border:#292929;--text:#f5f5f5;--muted:#999;--green:#ddd;--red:#fff;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#000;color:#f5f5f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input{font:inherit}.header{display:flex;align-items:center;gap:12px;padding:15px max(20px,calc((100vw - 760px)/2));border-bottom:1px solid #292929}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid #555;border-radius:9px;color:#fff;font-size:17px;font-weight:800}.header h1{font-size:17px;font-weight:700}.header span{display:block;margin-top:2px;color:#999;font-size:12px}.header-links{display:flex;align-items:center;gap:16px;margin-left:auto;font-size:13px}.header-links a,.header-links button{color:#ddd;text-decoration:none}.header-links a:hover,.header-links button:hover{color:#fff}.header-links button{padding:0;background:none;border:0;cursor:pointer}
.container{width:min(100% - 32px,720px);margin:0 auto;padding:42px 0 110px}.intro{margin-bottom:20px}.eyebrow{color:#aaa;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.intro h2{margin-top:8px;font-size:clamp(27px,5vw,38px);line-height:1.15;letter-spacing:-.04em}.intro p{margin-top:9px;color:#999;font-size:14px;line-height:1.6}.flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.flow span{padding:7px 10px;border:1px solid #292929;border-radius:999px;color:#ccc;font-size:12px}.flow b{color:#fff;margin-right:5px}
.search-card{padding:16px;background:#101010;border:1px solid #292929;border-radius:15px}.search-label{margin:0 0 10px;color:#ddd;font-size:13px;font-weight:650}.search-box{display:flex;gap:9px}.search-box input{flex:1;min-width:0;padding:13px 14px;border:1px solid #343434;border-radius:10px;outline:none;background:#050505;color:#fff;font-size:15px}.search-box input:focus{border-color:#888;box-shadow:0 0 0 2px #252525}.search-box input::placeholder{color:#777}.btn{padding:12px 17px;border:1px solid #fff;border-radius:10px;background:#fff;color:#000;cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s,color .15s}.btn:hover:not(:disabled){background:#ddd}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-outline{background:#111;color:#fff;border-color:#444}.btn-outline:hover:not(:disabled){background:#222}
.status{padding:30px 18px;color:#999;text-align:center;font-size:14px}.spinner{width:24px;height:24px;margin:0 auto 11px;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.results-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 1px 12px}.results-header h2{font-size:18px;font-weight:700}.results-header span{overflow-wrap:anywhere;color:#999;font-size:12px;text-align:right}.load-progress{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;padding:12px 13px;border:1px solid #303030;border-radius:11px;background:#0b0b0b}.load-dot{flex:0 0 8px;width:8px;height:8px;margin-top:5px;border-radius:50%;background:#fff}.load-copy{flex:1;color:#ccc;font-size:12px;line-height:1.5}.progress-track{height:3px;margin-top:8px;overflow:hidden;border-radius:9px;background:#292929}.progress-fill{height:100%;border-radius:9px;background:#eee;transition:width .3s ease}
.result-item{display:flex;align-items:flex-start;gap:11px;margin-bottom:8px;padding:13px 14px;border:1px solid #292929;border-radius:11px;background:#101010;cursor:pointer;transition:border-color .15s,background .15s}.result-item:hover{border-color:#555;background:#151515}.result-item.selected{border-color:#aaa;background:#1b1b1b}.result-item.disabled{cursor:default;opacity:.7}.check{display:flex;flex:0 0 19px;align-items:center;justify-content:center;width:19px;height:19px;margin-top:1px;border:1px solid #555;border-radius:5px}.selected .check{border-color:#fff;background:#fff}.check-mark{display:none;color:#000;font-size:12px;font-weight:900}.selected .check-mark{display:block}.result-info{flex:1;min-width:0}.result-label{font-size:14px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}.result-clean{margin-top:4px;color:#999;font-size:12px;overflow-wrap:anywhere}.result-number{min-width:25px;padding-top:2px;color:#888;font-size:12px;font-variant-numeric:tabular-nums}.page-heading{display:flex;align-items:center;gap:9px;margin:20px 2px 9px;color:#ccc;font-size:12px;font-weight:700}.page-heading:after{content:"";height:1px;flex:1;background:#292929}.warning{margin:12px 0;padding:11px 13px;border:1px solid #444;border-radius:10px;background:#111;color:#ddd;font-size:12px;line-height:1.5}.result-open{display:inline-block;margin-top:6px;color:#fff;font-size:12px}
.actions{position:fixed;z-index:12;left:50%;bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;width:min(100% - 28px,620px);padding:9px;transform:translateX(-50%);border:1px solid #333;border-radius:13px;background:rgba(12,12,12,.96);box-shadow:0 10px 35px rgba(0,0,0,.6)}.actions .btn{flex:1;text-align:center}.selected-count{padding:0 7px;color:#ccc;font-size:12px;white-space:nowrap}.log-box{margin-top:14px;padding:14px;border:1px solid #292929;border-radius:11px;background:#101010}.log-box h3{margin-bottom:8px;font-size:13px}.log-line{padding:6px 0;border-bottom:1px solid #292929;font-size:12px}.log-line:last-child{border-bottom:0}.log-line.ok,.log-line.err{color:#ddd}.empty{padding:34px 18px;color:#999;font-size:14px;text-align:center}
@media(max-width:600px){.header{padding:12px 15px}.header-links{gap:11px;font-size:12px}.container{width:calc(100% - 26px);padding-top:30px}.search-card{padding:12px}.search-box{flex-direction:column}.search-box .btn{width:100%}.results-header{align-items:flex-start;flex-direction:column;gap:4px}.results-header span{text-align:left}.actions{width:calc(100% - 18px);gap:5px;padding:7px}.actions .btn{padding:11px 8px;font-size:12px}.selected-count{padding:0 3px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="header">
  <div class="brand-mark" aria-hidden="true">C</div>
  <div>
    <h1>CVFetch</h1>
    <span>Telegram → Stremio library</span>
  </div>
  <nav class="header-links"><a href="/telegram-login">Telegram</a><form method="post" action="/logout"><button type="submit">Sign out</button></form></nav>
</div>

<main class="container">
  <section class="intro">
    <div class="eyebrow">Telegram media search</div>
    <h2>CVFetch</h2>
    <p>Search for a title, select results, and send them to your channel. Your Stremio library refreshes after delivery.</p>
    <div class="flow" aria-label="How it works"><span><b>1</b> Search</span><span><b>2</b> Select</span><span><b>3</b> Fetch</span></div>
  </section>
  <section class="search-card" aria-label="Search Telegram">
    <div class="search-label">What are you looking for?</div>
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Try a movie or series name..." autocomplete="off" />
      <button class="btn" id="searchBtn" onclick="doSearch()">Search</button>
    </div>
  </section>

  <div id="content">
    <div class="empty">Search for a movie to get started</div>
  </div>
</main>

<div class="actions" id="actions" style="display:none">
  <span class="selected-count" id="selCount">0 selected</span>
  <button class="btn btn-outline" onclick="selectAll()">Select all</button>
  <button class="btn" id="fetchBtn" onclick="doFetch()">Fetch →</button>
</div>

<script>
let currentSession = null;
let results = [];
let selected = new Set();
let pollTimer = null;
let pollBusy = false;
let lastRenderKey = '';
let searchComplete = false;

const queryInput = document.getElementById('queryInput');
const content = document.getElementById('content');
const actions = document.getElementById('actions');
const selCount = document.getElementById('selCount');
const searchBtn = document.getElementById('searchBtn');
const fetchBtn = document.getElementById('fetchBtn');

queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function setLoading(msg) {
  content.innerHTML = `<div class="status"><div class="spinner"></div>${msg}</div>`;
}

function showError(msg) {
  content.innerHTML = `<div class="status" style="color:var(--red)">${escHtml(msg)}</div>`;
}

async function doSearch() {
  const query = queryInput.value.trim();
  if (!query) return;

  clearPoll();
  lastRenderKey = '';
  searchComplete = false;
  selected.clear();
  actions.style.display = 'none';
  searchBtn.disabled = true;
  setLoading('Searching...');

  try {
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });
    const data = await res.json();
      if (data.error) { showError(data.error); searchBtn.disabled = false; return; }
    currentSession = data.session_id;
    pollStatus();
  } catch (e) {
    showError('Network error');
    searchBtn.disabled = false;
  }
}

function pollStatus() {
  const check = async () => {
    if (pollBusy || !currentSession) return;
    pollBusy = true;
    try {
      const res = await fetch(`/api/status/${currentSession}`);
      const data = await res.json();
      handleStatus(data);
    } catch (e) {
      // Keep polling through brief network hiccups.
    } finally {
      pollBusy = false;
    }
  };
  check();
  pollTimer = setInterval(check, 700);
}

function clearPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function handleStatus(data) {
  if (data.status === 'searching' || data.status === 'pending') {
    searchComplete = false;
    results = data.results || [];
    if (results.length) {
      renderResults(data.warning, true, data.pages_loaded || 0, data.pages_total || 0);
    } else {
      setLoading(data.status === 'pending' ? 'Starting your search...' : 'Talking to Telegram search bot...');
    }
    return;
  }
  if (data.status === 'joining') {
    setLoading('Joining the required channel, then retrying...');
    return;
  }
  if (data.status === 'error') {
    clearPoll();
    showError(data.error || 'Something went wrong');
    searchBtn.disabled = false;
    return;
  }
  if (data.status === 'no_results') {
    clearPoll();
    showError(data.error || 'No results found. Try a different name.');
    searchBtn.disabled = false;
    return;
  }
  if (data.status === 'ready') {
    clearPoll();
    searchComplete = true;
    results = data.results || [];
    renderResults(data.warning, false, data.pages_loaded || 0, data.pages_total || 0);
    searchBtn.disabled = false;
    return;
  }
  if (data.status === 'fetching') {
    const done = data.fetched || 0;
    const total = data.total || 0;
    setLoading(`Sending files to your channel... ${done}/${total}`);
    renderLog(data.fetch_log || []);
    return;
  }
  if (data.status === 'done') {
    clearPoll();
    setLoading('All done — your channel has been updated.');
    renderLog(data.fetch_log || []);
    actions.style.display = 'none';
    fetchBtn.disabled = false;
    searchBtn.disabled = false;
  }
}

function renderResults(warning = null, loading = false, pagesLoaded = 0, pagesTotal = 0) {
  if (!results.length) {
    content.innerHTML = '<div class="empty">No results found</div>';
    actions.style.display = 'none';
    return;
  }

  const pageTotal = Math.max(pagesTotal, ...results.map(r => Number(r.page_total || r.page || 1)));
  const key = [results.length, pagesLoaded, pageTotal, loading, warning || ''].join(':');
  if (key === lastRenderKey) return;
  lastRenderKey = key;

  const header = `
    <div class="results-header">
      <h2>${results.length} result${results.length === 1 ? '' : 's'} found</h2>
      <span>${escHtml(queryInput.value.trim())}</span>
    </div>
  `;
  const progress = loading ? `
    <div class="load-progress" role="status" aria-live="polite">
      <span class="load-dot" aria-hidden="true"></span>
      <div class="load-copy">
        <strong>Reading Telegram pages</strong> · ${pagesLoaded} of ${pageTotal || '…'} loaded.
        New results will appear here as they arrive.
        <div class="progress-track"><div class="progress-fill" style="width:${pageTotal ? Math.min(100, pagesLoaded / pageTotal * 100) : 18}%"></div></div>
      </div>
    </div>` : '';
  let lastPage = null;
  const items = results.map((r, i) => {
    const page = Number(r.page || 1);
    const heading = page !== lastPage ? `<h3 class="page-heading">Page ${page}${r.page_total ? ` of ${Number(r.page_total)}` : ''}</h3>` : '';
    lastPage = page;
    const url = safeTelegramUrl(r.url);
    if (r.button_type === 'url') {
      const selectable = Boolean(r.can_fetch);
      const action = selectable
        ? '<div class="result-clean">Choose this result, then send it to your channel</div>'
        : `<div class="result-clean">This link cannot be fetched automatically${url ? ` · <a class="result-open" href="${escHtml(url)}" target="_blank" rel="noopener noreferrer">Open in Telegram ↗</a>` : ''}</div>`;
      return `${heading}<div class="result-item${selectable ? '' : ' disabled'}" ${selectable ? `id="item_${i}" onclick="toggleSelect(${i})"` : ''}>${selectable ? '<div class="check"><span class="check-mark">✓</span></div>' : ''}<span class="result-number">${i + 1}.</span><div class="result-info"><div class="result-label">${escHtml(r.label)}</div>${action}</div></div>`;
    }
    return `${heading}<div class="result-item" id="item_${i}" onclick="toggleSelect(${i})"><div class="check"><span class="check-mark">✓</span></div><span class="result-number">${i + 1}.</span><div class="result-info"><div class="result-label">${escHtml(r.label)}</div><div class="result-clean">→ ${escHtml(r.clean_name)}</div></div></div>`;
  }).join('');

  content.innerHTML = header + progress + (warning ? `<div class="warning">${escHtml(warning)}</div>` : '') + items;
  if (loading || !searchComplete) {
    actions.style.display = 'none';
  } else {
    actions.style.display = 'flex';
    updateSelCount();
  }
}

function toggleSelect(i) {
  if (!results[i] || !results[i].can_fetch) return;
  if (selected.has(i)) selected.delete(i);
  else selected.add(i);
  const el = document.getElementById(`item_${i}`);
  el.classList.toggle('selected', selected.has(i));
  updateSelCount();
}

function selectAll() {
  const selectable = results.map((r, i) => r.can_fetch ? i : null).filter(i => i !== null);
  if (selected.size === selectable.length) {
    selected.clear();
    document.querySelectorAll('.result-item').forEach(el => el.classList.remove('selected'));
  } else {
    selectable.forEach(i => selected.add(i));
    selectable.forEach(i => document.getElementById(`item_${i}`)?.classList.add('selected'));
  }
  updateSelCount();
}

function updateSelCount() {
  selCount.textContent = `${selected.size} selected`;
  fetchBtn.disabled = selected.size === 0;
}

async function doFetch() {
  if (!selected.size) return;
  fetchBtn.disabled = true;
  clearPoll();
  setLoading(`Starting fetch for ${selected.size} file(s)...`);

  try {
    const res = await fetch('/api/fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: currentSession, indices: [...selected] })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not start fetch');
    pollStatus();
  } catch (e) {
    showError(e.message || 'Network error');
    fetchBtn.disabled = false;
  }
}

function renderLog(lines) {
  if (!lines.length) return;
  const existing = document.getElementById('logBox');
  const html = `
    <div class="log-box" id="logBox">
      <h3>Progress</h3>
      ${lines.map(l => `<div class="log-line ${l.ok ? 'ok' : 'err'}">${escHtml(l.text)}</div>`).join('')}
    </div>
  `;
  if (existing) existing.outerHTML = html;
  else content.insertAdjacentHTML('beforeend', html);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function safeTelegramUrl(value) {
  try {
    const url = new URL(value);
    if (url.protocol === 'tg:' && url.hostname.toLowerCase() === 'resolve') return url.href;
    return url.protocol === 'https:' && ['t.me','www.t.me','telegram.me','www.telegram.me'].includes(url.hostname.toLowerCase()) ? url.href : null;
  } catch (e) { return null; }
}
</script>
</body>
</html>
