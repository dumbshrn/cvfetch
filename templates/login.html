<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CVFetch sign in</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10141b;color:#edf2f7;font:16px system-ui,sans-serif;padding:20px}
    main{width:min(100%,390px);background:#1a2230;border:1px solid #303b4c;border-radius:16px;padding:26px}h1{margin:0 0 8px;color:#ff5364}p{color:#abb6c7;line-height:1.5}label{display:block;margin:18px 0 7px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #46546a;background:#10141b;color:white;font-size:16px}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:9px;background:#e50914;color:white;font-weight:700;font-size:16px;cursor:pointer}.error{color:#ff838b}
  </style>
</head>
<body><main>
  <h1>CVFetch</h1><p>Sign in to your private CVFetch page.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post"><label for="password">Web password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
</main></body>
</html>
